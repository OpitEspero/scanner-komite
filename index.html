
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner NISN - Komite Sekolah</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    #reader {
      width: 100%;
      border: none !important;
    }
    #reader video {
      border-radius: 12px;
    }
    #reader__dashboard_section_csr button,
    #reader__dashboard_section_swaplink {
      margin: 6px;
    }
    #reader__status_span {
      color: white !important;
    }
  </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <header class="w-full max-w-md text-center py-4 border-b border-slate-800">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-2 text-white">
      <i class="fa-solid fa-qrcode text-2xl"></i>
    </div>
    <h1 class="text-xl font-bold">Scanner QR NISN</h1>
    <p class="text-xs text-slate-400 mt-1">Komite Sekolah - Pemindai Cepat</p>
  </header>

  <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-4 space-y-4">

    <div class="w-full bg-slate-800 border-2 border-slate-700 rounded-2xl p-3 shadow-xl">
      <div id="reader" class="w-full overflow-hidden rounded-xl bg-slate-950"></div>
    </div>

    <div id="statusBox" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-center">
      Tekan tombol Aktifkan Kamera untuk memulai pemindaian.
    </div>

    <div class="flex gap-2 w-full">
      <button id="btnStart" onclick="startScanner()"
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold">
        <i class="fa-solid fa-camera mr-2"></i>Aktifkan Kamera
      </button>

      <button id="btnStop" onclick="stopScanner()"
        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-semibold hidden">
        <i class="fa-solid fa-stop mr-2"></i>Matikan Kamera
      </button>
    </div>

    <div id="resultBox" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 hidden">
      <span class="text-xs font-semibold text-emerald-400 uppercase">Hasil Scan NISN:</span>
      <div class="flex items-center justify-between gap-2 mt-2">
        <span id="txtNisnResult" class="text-xl font-bold break-all"></span>
        <button onclick="copyToClipboard()"
          class="bg-blue-600 text-white px-3 py-2 rounded-lg text-xs whitespace-nowrap">
          <i class="fa-solid fa-copy mr-1"></i>Salin
        </button>
      </div>
      <p id="txtCopyStatus" class="text-xs text-emerald-400 mt-2 hidden">
        NISN berhasil disalin!
      </p>
    </div>

  </main>

  <footer class="w-full max-w-md text-center py-3 border-t border-slate-800 text-xs text-slate-500">
    Arahkan kamera ke QR Code Kartu Pelajar Siswa
  </footer>

<script>
  let scanner = null;
  let isRunning = false;
  let lastScannedNisn = "";

  const statusBox = document.getElementById("statusBox");
  const btnStart = document.getElementById("btnStart");
  const btnStop = document.getElementById("btnStop");

  function setStatus(message, color = "text-slate-200") {
    statusBox.className =
      "w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-center " + color;
    statusBox.textContent = message;
  }

  async function startScanner() {
    if (isRunning) return;

    if (!window.isSecureContext) {
      setStatus("Halaman tidak berada dalam koneksi aman HTTPS.", "text-red-400");
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Browser tidak mendukung akses kamera. Periksa browser dan izin perangkat.", "text-red-400");
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      setStatus("Library HTML5-QRCode gagal dimuat. Periksa koneksi internet.", "text-red-400");
      return;
    }

    btnStart.disabled = true;
    btnStart.textContent = "Mengaktifkan kamera...";
    setStatus("Meminta izin akses kamera...", "text-yellow-300");

    try {
      scanner = new Html5Qrcode("reader");

      await scanner.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: { width: 220, height: 220 },
    aspectRatio: 1.0
  },
  onScanSuccess,
  () => {}
);

      isRunning = true;
      btnStart.classList.add("hidden");
      btnStop.classList.remove("hidden");

      setStatus("Kamera aktif. Arahkan ke QR Code siswa.", "text-emerald-400");

    } catch (error) {
      console.error("Kesalahan kamera:", error);

      let message = error.message || String(error);

      if (error.name === "NotAllowedError") {
        message = "Izin kamera ditolak. Aktifkan izin kamera pada pengaturan Chrome.";
      } else if (error.name === "NotFoundError") {
        message = "Kamera tidak ditemukan.";
      } else if (error.name === "NotReadableError") {
        message = "Kamera sedang digunakan aplikasi lain.";
      } else if (error.name === "OverconstrainedError") {
        message = "Kamera yang diminta tidak tersedia.";
      }

      setStatus("Gagal mengaktifkan kamera: " + message, "text-red-400");

      if (scanner) {
        try {
          await scanner.clear();
        } catch (e) {}
        scanner = null;
      }

      isRunning = false;
      btnStart.classList.remove("hidden");
      btnStop.classList.add("hidden");
    }

    btnStart.disabled = false;
    btnStart.innerHTML = '<i class="fa-solid fa-camera mr-2"></i>Aktifkan Kamera';
  }

  async function stopScanner() {
    if (!scanner || !isRunning) return;

    try {
      await scanner.stop();
      await scanner.clear();

      scanner = null;
      isRunning = false;

      btnStart.classList.remove("hidden");
      btnStop.classList.add("hidden");

      setStatus("Kamera berhasil dimatikan.", "text-slate-200");

    } catch (error) {
      setStatus("Gagal menghentikan kamera: " + error.message, "text-red-400");
    }
  }

  async function onScanSuccess(decodedText) {
  const nisn = String(decodedText || "").trim();
  if (!nisn || lastScannedNisn === nisn) return;

  // Mencegah hasil scan berulang ketika kamera masih menangkap QR yang sama.
  lastScannedNisn = nisn;
  document.getElementById("txtNisnResult").textContent = nisn;
  document.getElementById("resultBox").classList.remove("hidden");

  if (window.opener && !window.opener.closed) {
    setStatus("QR berhasil dibaca. Mengirim NISN ke aplikasi keuangan...", "text-emerald-400");
    try {
      // Parent memeriksa origin dan sumber jendela sebelum menerima NISN.
      window.opener.postMessage({
        type: "KOMITE_QR_SCAN",
        nisn: nisn
      }, "*");

      // Lepaskan kamera sebelum popup ditutup.
      await stopScanner();
      setStatus("Scan berhasil. Halaman scanner akan ditutup...", "text-emerald-400");
      setTimeout(function () {
        window.close();
      }, 350);
    } catch (error) {
      console.error("Gagal mengirim hasil scan:", error);
      setStatus("Gagal mengirim NISN ke aplikasi induk: " + (error.message || error), "text-red-400");
    }
  } else {
    // Jika URL scanner dibuka sendiri, tampilkan hasil dan sediakan salin manual.
    setStatus("QR Code berhasil dibaca. Scanner dibuka tanpa aplikasi induk.", "text-emerald-400");
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(nisn)
        .then(() => showCopyStatus())
        .catch(error => console.log("Salin otomatis gagal:", error));
    }
  }
}


  function copyToClipboard() {
    const nisn = document.getElementById("txtNisnResult").textContent;
    if (!nisn) return;

    if (!navigator.clipboard) {
      alert("Clipboard tidak tersedia. Salin NISN secara manual.");
      return;
    }

    navigator.clipboard.writeText(nisn)
      .then(showCopyStatus)
      .catch(() => alert("Gagal menyalin NISN."));
  }

  function showCopyStatus() {
    const status = document.getElementById("txtCopyStatus");
    status.classList.remove("hidden");
    setTimeout(() => status.classList.add("hidden"), 3000);
  }
</script>

</body>
</html>
